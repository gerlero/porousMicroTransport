[project]
name = "porous-micro-transport-tests"
version = "0.0.0"
requires-python = ">=3.14"
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
test = [
    "foamlib>=1,<2",
    "fronts>=1.2,<2",
    "numpy>=1,<3",
    "pytest>=7,<10",
    "pytest-asyncio-cooperative>=0.37,<0.41",
    "scipy>=1,<2",
]
lint = ["ruff>=0.17,<0.18"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]
